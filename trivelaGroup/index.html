<!doctype html>

    <!-- SEO: ovo su POCETNE vrednosti. Svaka strana ih menja kroz useSeo()

    <title>Trivela Group — Building iconic athlete brands</title>

    <meta name="theme-color" content="#01072d" />

    <meta property="og:type" content="website" />

    <meta property="og:image:height" content="630" />
